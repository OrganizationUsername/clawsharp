name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      run_ollama:
        description: 'Run Ollama E2E tests (pulls ~400MB model)'
        required: false
        type: boolean
        default: false
      ollama_model:
        description: 'Ollama model to use for E2E tests'
        required: false
        type: string
        default: 'qwen2.5:0.5b'

jobs:
  db-integration:
    name: Database Integration Tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.102'

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Svelte web UI dependencies
        run: cd src/clawsharp-web && npm ci

      # Build via .slnx to work around .NET 10 MSBuild glob expansion bug
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run DB integration tests
        run: >
          dotnet test tests/clawsharp.Tests/clawsharp.Tests.csproj -c Release --no-build
          --filter "Category=Integration&FullyQualifiedName!~LmStudio&FullyQualifiedName!~E2E"
          --logger "trx;LogFileName=db-integration.trx"
          --results-directory ./test-results
        env:
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-integration-results
          path: ./test-results/*.trx

  ollama-e2e:
    name: Ollama E2E Tests
    runs-on: ubuntu-24.04
    if: ${{ inputs.run_ollama == true }}

    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434

    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.102'

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Svelte web UI dependencies
        run: cd src/clawsharp-web && npm ci

      # Build via .slnx to work around .NET 10 MSBuild glob expansion bug
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Pull Ollama model
        run: |
          # Wait for Ollama to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama is ready"
              break
            fi
            echo "Waiting for Ollama... ($i/30)"
            sleep 2
          done
          echo "Pulling model: ${{ inputs.ollama_model }}"
          curl -sf http://localhost:11434/api/pull -d '{"name":"${{ inputs.ollama_model }}"}' | tail -1
          echo "Model pulled successfully"

      - name: Verify model is loaded
        run: |
          MODELS=$(curl -sf http://localhost:11434/api/tags)
          echo "Available models: $MODELS"
          echo "$MODELS" | grep -q "${{ inputs.ollama_model }}" || { echo "Model not found!"; exit 1; }

      - name: Run E2E tests against Ollama
        run: >
          dotnet test tests/clawsharp.Tests/clawsharp.Tests.csproj -c Release --no-build
          --filter "FullyQualifiedName~LmStudioRoundTripTests"
          --logger "trx;LogFileName=ollama-e2e.trx"
          --results-directory ./test-results
        env:
          OLLAMA_HOST: http://localhost:11434

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ollama-e2e-results
          path: ./test-results/*.trx
