# clawsharp compose.yaml
#
# Quick start (env var method — simplest):
#   1. Generate an encryption key: openssl rand -hex 32
#   2. Create a .env file (add it to .gitignore!):
#        CLAWSHARP_SECRET_KEY=<64-char hex from step 1>
#   3. docker compose up --build
#
# Recommended (Docker native secrets — more secure, not visible in docker inspect):
#   1. Generate: openssl rand -hex 32 > clawsharp_secret_key.txt
#   2. Lock it down: chmod 600 clawsharp_secret_key.txt
#   3. Add to .gitignore: clawsharp_secret_key.txt
#   4. Uncomment the 'secrets:' blocks below and remove CLAWSHARP_SECRET_KEY from 'environment:'
#
# Secret key is read in priority order:
#   CLAWSHARP_SECRET_KEY env var  →  /run/secrets/clawsharp_secret_key  →  ~/.clawsharp/.secret_key
#
# Profiles:
#   docker compose --profile postgres up   # PostgreSQL memory backend
#   docker compose --profile mssql up      # SQL Server memory backend
#
# Env var config overrides (CLAWSHARP__ prefix, double-underscore = hierarchy):
#   These override config.json values. Values are held in memory only and
#   never written to disk, so they do not need the enc2: prefix.
#   Example:
#     CLAWSHARP__providers__openai__apiKey=sk-...
#     CLAWSHARP__channels__telegram__token=123456:ABC...

# ── Docker native secrets (recommended for production) ───────────────────────
# Uncomment to use instead of CLAWSHARP_SECRET_KEY env var.
# The secret file is mounted at /run/secrets/clawsharp_secret_key inside the container.
#secrets:
#  clawsharp_secret_key:
#    file: ./clawsharp_secret_key.txt   # generate: openssl rand -hex 32 > clawsharp_secret_key.txt

services:
  clawsharp:
    container_name: clawsharp
    image: clawsharp
    build:
      context: .
      dockerfile: src/clawsharp/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    # ── Container hardening ──────────────────────────────────────────────────
    security_opt:
      - no-new-privileges:true   # process cannot gain new privileges via setuid/setgid
    cap_drop:
      - ALL                      # drop all Linux capabilities; .NET gateway needs none
    # cap_add:                   # uncomment only if you bind the Web channel to port < 1024
    #   - NET_BIND_SERVICE
    read_only: true              # container filesystem is immutable; volumes below are still writable
    tmpfs:
      - /tmp                     # .NET runtime temp files
      - /var/tmp                 # some system libs expect this
    network_mode: host
    volumes:
      # Persists config.json, sessions, memory, skills, and the .secret_key file.
      # The .secret_key file is only used when neither CLAWSHARP_SECRET_KEY env var
      # nor a Docker secret is set.
      - clawsharp-data:/home/app/.clawsharp
      # ── Workspace mount (optional) ──────────────────────────────────────────
      # Mount a host directory to give the AI agent access to your project files.
      # Without this, file tools can only access files inside ~/.clawsharp/workspace.
      # For maximum security, omit this mount and use an IDE MCP server instead.
      #- ${CLAWSHARP_WORKSPACE:-./workspace}:/home/app/.clawsharp/workspace
    # ── Uncomment to use Docker native secrets instead of env var ────────────
    #secrets:
    #  - clawsharp_secret_key
    environment:
      DOTNET_ENVIRONMENT: Production

      # ── Encryption key (env var method) ─────────────────────────────────────
      CLAWSHARP_SECRET_KEY: "${CLAWSHARP_SECRET_KEY:?Set CLAWSHARP_SECRET_KEY in .env: echo CLAWSHARP_SECRET_KEY=$(openssl rand -hex 32) >> .env}"

      # ── Web channel ────────────────────────────────────────────────────────
      CLAWSHARP__channels__web__enabled: "true"
      CLAWSHARP__channels__web__webHost: "0.0.0.0"
      CLAWSHARP__channels__web__webPort: "3001"
      CLAWSHARP__channels__web__pairingToken: "test-token-123"

      # ── PostgreSQL memory backend ──────────────────────────────────────────
      CLAWSHARP__memory__backend: postgres
      CLAWSHARP__memory__connectionString: "Host=127.0.0.1;Database=clawsharp;Username=clawsharp;Password=${POSTGRES_PASSWORD}"

      # ── Analytics (interactions) → PostgreSQL ──────────────────────────────
      CLAWSHARP__analytics__enabled: "true"
      CLAWSHARP__analytics__backend: postgres

      # ── LM Studio (host network — use localhost) ───────────────────────────
      CLAWSHARP__providers__lmstudio__baseUrl: "http://127.0.0.1:1234"
      CLAWSHARP__agents__defaults__model: "qwen/qwen3.5-9b"

      # ── Optional: inline config overrides (no file needed) ──────────────────
      #CLAWSHARP__providers__openai__apiKey: ""
      #CLAWSHARP__providers__anthropic__apiKey: ""
      #CLAWSHARP__channels__telegram__token: ""
      #CLAWSHARP__channels__discord__token: ""
      #CLAWSHARP__channels__slack__botToken: ""
      #CLAWSHARP__channels__slack__appToken: ""
      #CLAWSHARP__tools__workspace: "/home/app/.clawsharp/workspace"

  # ── PostgreSQL (pgvector) ──────────────────────────────────────────────────
  postgres:
    container_name: clawsharp-postgres-db
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: clawsharp
      POSTGRES_USER: clawsharp
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # local dev access only; remove in production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clawsharp -d clawsharp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MS SQL Server 2025 (opt-in: docker compose --profile mssql up) ──────────
  #
  # Note: MSSQL requires ACCEPT_EULA=Y and a strong SA password (min 8 chars,
  #       upper + lower + digit + symbol).
  # Connection string injected automatically via clawsharp-mssql service below.
  #
  # For manual connection string override, export:
  #   export MSSQL_SA_PASSWORD=YourStrong!Password
  mssql:
    container_name: clawsharp-mssql-db
    image: mcr.microsoft.com/mssql/server:2025-latest
    profiles: [mssql]
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
      MSSQL_PID: Developer
    volumes:
      - mssql-data:/var/opt/mssql
    ports:
      - "127.0.0.1:1433:1433"   # local dev access only; remove in production
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -No"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  clawsharp-mssql:
    container_name: clawsharp-mssql
    extends:
      service: clawsharp
    profiles: [mssql]
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      CLAWSHARP_SECRET_KEY: "${CLAWSHARP_SECRET_KEY:?Set CLAWSHARP_SECRET_KEY in .env}"
      CLAWSHARP__memory__backend: mssql
      CLAWSHARP__memory__connectionString: "Server=mssql;Database=clawsharp;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"

volumes:
  clawsharp-data:
  postgres-data:
  mssql-data:
